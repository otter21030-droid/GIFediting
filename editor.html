<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>쓰기 쉬운 GIF 편집기</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="editor.css" />
</head>
<body class="editor-page">
  <div class="shell">
    <header class="titlebar">
      <a class="brand-mark" href="index.html" aria-label="스마트 GIF 생성기"></a>
      <a class="titlebar-name" href="index.html">스마트 GIF 생성기</a>
      <nav class="top-nav"><a href="index.html">생성기</a><a class="active" href="editor.html">편집기</a></nav>
      <div class="titlebar-meta">내 컴퓨터에서 안전하게 편집</div>
    </header>

    <main class="editor-main">
      <section class="editor-hero">
        <p class="eyebrow">SMART GIF STUDIO · EDITOR</p>
        <h1>쓰기 쉬운 <em>GIF</em> 편집기</h1>
        <p>GIF 파일을 간편히 편집하기</p>
      </section>

      <section class="gif-drop" id="gifDrop">
        <div><b>GIF 파일을 여기에 놓으세요</b><span id="gifDropStatus">한 번에 파일 하나를 편집합니다.</span></div>
        <button class="btn primary" id="gifPick" type="button">GIF 파일 선택</button>
        <input id="gifFile" type="file" accept="image/gif,.gif" hidden />
      </section>
      <div class="gif-alert" id="gifAlert" hidden></div>

      <section class="editor-workspace" id="editorWorkspace" hidden>
        <div class="editor-canvas-column">
          <article class="preview-panel" id="originalPanel">
            <header class="preview-panel-head">
              <button type="button" class="panel-toggle" data-target="originalBody" aria-label="원본 미리보기 접기">−</button>
              <div><h2>Original GIF</h2><p id="originalMeta">원본 미리보기</p></div>
            </header>
            <div class="preview-body" id="originalBody">
              <div class="gif-stage"><img id="originalGif" alt="원본 GIF 미리보기" /></div>
              <dl class="gif-meta" id="originalInfo"></dl>
            </div>
          </article>
          <article class="preview-panel result-panel" id="resultPanel" hidden>
            <header class="preview-panel-head">
              <button type="button" class="panel-toggle" data-target="resultBody" aria-label="편집 결과 접기">−</button>
              <div><h2 id="resultTitle">편집된 GIF</h2><p id="resultMeta">결과 미리보기</p></div>
              <button type="button" class="btn download" id="resultDownload">다운로드</button>
            </header>
            <div class="preview-body" id="resultBody">
              <div class="gif-stage"><img id="resultGif" alt="편집 결과 미리보기" /></div>
              <dl class="gif-meta" id="resultInfo"></dl>
            </div>
          </article>
        </div>

        <aside class="tools-panel">
          <header class="tools-heading"><span class="tool-spark">✦</span><div><h2>Editor Tools</h2><p>원하는 편집 도구를 선택하세요</p></div></header>
          <div class="tool-picker" id="toolPicker">
            <button data-tool="resize"><span>↔</span>Resize</button>
            <button data-tool="crop"><span>◩</span>Crop</button>
            <button data-tool="downsize"><span>⇩</span>Downsizing</button>
            <button data-tool="format"><span>⇄</span>Format Convert</button>
            <button data-tool="rotate"><span>⟳</span>Rotate</button>
            <button data-tool="optimize"><span>✧</span>Optimize</button>
            <button data-tool="reverse"><span>◀</span>Reverse</button>
            <button data-tool="speed"><span>◷</span>Speed</button>
            <button data-tool="cut"><span>✂</span>Cut</button>
          </div>
          <section class="tool-config" id="toolConfig" hidden></section>
          <section class="save-config" id="saveConfig" hidden>
            <h3>저장 옵션</h3>
            <label>파일명<input id="saveFilename" type="text" /></label>
            <p id="saveFolderHint">저장할 위치는 다운로드를 누른 뒤 선택합니다.</p>
            <button type="button" class="btn primary" id="saveResult">편집본 저장</button>
          </section>
          <div class="editor-progress" id="editorProgress" hidden>
            <div class="editor-progress-label"><span id="editorStatus">준비 중</span><span id="editorPercent">0%</span></div>
            <div class="track"><div class="fill" id="editorFill"></div></div>
          </div>
          <p class="editor-error" id="editorError" hidden></p>
        </aside>
      </section>
    </main>
  </div>
  <script type="module" src="gif-editor.mjs"></script>
</body>
</html>
